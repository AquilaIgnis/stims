android.useAndroidX=true
android.enableJetifier=true
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=false

# Jetifier chokes on Robolectric's BouncyCastle jars (JDK-25 class files) while rewriting the
# unit-test classpath. Those are test-only and contain no support-library references, so skip them.
android.jetifier.ignorelist=bcprov-jdk18on,bcutil-jdk18on,bcpkix-jdk18on
