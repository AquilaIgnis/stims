android.useAndroidX=true
android.enableJetifier=false
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED
org.gradle.configuration-cache=false

# AGP 8.6+ ships a better resource shrinker that is not the default until AGP 9.
android.r8.optimizedResourceShrinking=true
# Opted into on purpose, so silence the "experimental option" warning it prints on every build.
android.suppressUnsupportedOptionWarnings=android.suppressUnsupportedOptionWarnings,android.r8.optimizedResourceShrinking
