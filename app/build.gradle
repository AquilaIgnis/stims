plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// ---- Release signing --------------------------------------------------------------------
// Credentials come from an untracked .env at the repo root (already in .gitignore):
//   VIVE_KEYSTORE=android-release.jks        # relative to the repo root, or absolute
//   VIVE_KEYSTORE_PASSWORD=...
//   VIVE_KEY_ALIAS=stims
// Environment variables of the same names win over the file, for CI. When neither is present
// — F-Droid's buildserver, a fresh clone, a contributor's machine — the release build stays
// unsigned rather than failing, and the APK is named "-unsigned" so it cannot be mistaken for
// a shippable one. F-Droid signs with their own key, so that path must keep working.
def readDotEnv = {
    def values = [:]
    def envFile = rootProject.file('.env')
    if (envFile.exists()) {
        envFile.eachLine { rawLine ->
            def line = rawLine.trim()
            if (line.isEmpty() || line.startsWith('#')) return
            def idx = line.indexOf('=')
            if (idx <= 0) return
            def key = line.substring(0, idx).trim()
            def value = line.substring(idx + 1).trim()
            if (value.length() >= 2 &&
                ((value.startsWith('"') && value.endsWith('"')) ||
                 (value.startsWith("'") && value.endsWith("'")))) {
                value = value.substring(1, value.length() - 1)
            }
            values[key] = value
        }
    }
    return values
}
def dotEnv = readDotEnv()
def signingValue = { String key -> System.getenv(key) ?: dotEnv[key] }

def releaseStorePassword = signingValue('VIVE_KEYSTORE_PASSWORD')
def releaseKeyAliasName = signingValue('VIVE_KEY_ALIAS')
// Only one password is configured: the store password also unlocks the key.
def releaseKeyPasswordValue = signingValue('VIVE_KEY_PASSWORD') ?: releaseStorePassword
def releaseStorePath = signingValue('VIVE_KEYSTORE')
def releaseStoreFileValue = null
if (releaseStorePath) {
    def candidate = new File(releaseStorePath)
    releaseStoreFileValue = candidate.isAbsolute() ? candidate : rootProject.file(releaseStorePath)
}
def canSignRelease = releaseStoreFileValue != null && releaseStoreFileValue.exists() &&
        releaseStorePassword && releaseKeyAliasName

android {
    namespace 'acidburn.stims'
    compileSdk 36

    defaultConfig {
        applicationId "acidburn.stims"
        minSdk 24
        targetSdk 36
        versionCode 7
        versionName "1.5"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    signingConfigs {
        release {
            if (canSignRelease) {
                storeFile releaseStoreFileValue
                storePassword releaseStorePassword
                keyAlias releaseKeyAliasName
                keyPassword releaseKeyPasswordValue
            }
        }
    }

    buildTypes {
        release {
            if (canSignRelease) signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        // Identical R8 pipeline and keep rules to release, but debug-signed so the instrumented
        // suite can actually be installed and run against minified, shrunk, obfuscated code:
        //   ./gradlew connectedMinifiedAndroidTest -PtestMinified
        minified {
            initWith release
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
            proguardFile 'proguard-rules-instrumentation.pro'
        }
    }

    // androidTest runs against debug by default; -PtestMinified points it at the R8 output.
    testBuildType = project.hasProperty('testMinified') ? 'minified' : 'debug'

    // Ship the release APK as stims-<version>.apk instead of app-release.apk.
    applicationVariants.all { variant ->
        if (variant.buildType.name != 'release') return
        variant.outputs.all { output ->
            output.outputFileName = "stims-${variant.versionName}${canSignRelease ? '' : '-unsigned'}.apk"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.15'
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    testOptions {
        unitTests {
            // Robolectric needs the merged resources/assets/manifest of the app.
            includeAndroidResources = true
            returnDefaultValues = true
            all {
                testLogging {
                    events "passed", "skipped", "failed"
                    exceptionFormat "full"
                }
                // Robolectric reaches into java.base internals; JDK 17+ needs these opened.
                jvmArgs(
                        '--add-opens=java.base/java.lang=ALL-UNNAMED',
                        '--add-opens=java.base/java.util=ALL-UNNAMED',
                        '--add-opens=java.base/java.io=ALL-UNNAMED',
                        '--add-opens=java.base/java.net=ALL-UNNAMED',
                        '--add-opens=java.base/java.security=ALL-UNNAMED',
                        '--add-opens=java.base/java.text=ALL-UNNAMED',
                        '--add-opens=java.base/jdk.internal.access=ALL-UNNAMED',
                        '--add-opens=java.base/jdk.internal.misc=ALL-UNNAMED',
                )
            }
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation platform('androidx.compose:compose-bom:2025.02.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    
    implementation 'com.google.android.material:material:1.12.0'

    // ---- Local unit tests (JVM, Robolectric — no device required) ----
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
    testImplementation 'androidx.test:core-ktx:1.6.1'
    testImplementation 'androidx.test.ext:junit-ktx:1.2.1'
    testImplementation 'com.google.truth:truth:1.4.4'
    testImplementation platform('androidx.compose:compose-bom:2025.02.00')
    testImplementation 'androidx.compose.ui:ui-test-junit4'

    // ---- Instrumented tests (on-device / emulator) ----
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:core-ktx:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'com.google.truth:truth:1.4.4'
    androidTestImplementation platform('androidx.compose:compose-bom:2025.02.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'

    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}

// Alias for CI/CD systems or scripts that expect the standard Java 'testClasses' task
tasks.register("testClasses") {
    // This maps to compiling the debug unit tests
    dependsOn "compileDebugUnitTestSources"
}
